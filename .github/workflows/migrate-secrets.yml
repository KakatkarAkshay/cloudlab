name: Migrate secrets to TF_VAR names

on:
  push:
    branches: [feat/migrate]

permissions: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SECRETS: ${{ toJSON(secrets) }}
      VARS: ${{ toJSON(vars) }}

    steps:
      - name: Migrate secrets
        run: |
          set -euo pipefail
          MAP=(
            OCI_PRIVATE_KEY:oci_private_key
            TENANCY_1_OCID:tenancy_1_ocid
            TENANCY_1_USER_OCID:tenancy_1_user_ocid
            TENANCY_1_COMPARTMENT_OCID:tenancy_1_compartment_ocid
            TENANCY_2_OCID:tenancy_2_ocid
            TENANCY_2_USER_OCID:tenancy_2_user_ocid
            TENANCY_2_COMPARTMENT_OCID:tenancy_2_compartment_ocid
            IDRIVE_ACCESS_KEY_ID:idrive_access_key_id
            IDRIVE_SECRET_ACCESS_KEY:idrive_secret_access_key
            GHCR_READ_PAT:github_packages_token
            RUNNER_APP_ID:github_runner_app_id
            RUNNER_APP_INSTALLATION_ID:github_runner_app_installation_id
            RUNNER_APP_PRIVATE_KEY:github_runner_app_private_key
            OAUTH2_PROXY_CLIENT_ID:oauth2_client_id
            OAUTH2_PROXY_CLIENT_SECRET:oauth2_client_secret
            OAUTH2_PROXY_AUTHORIZED_EMAILS:oauth2_authorized_emails
          )
          for pair in "${MAP[@]}"; do
            src=${pair%%:*}; tfvar=${pair#*:}
            val=$(jq -r --arg k "$src" '.[$k] // empty' <<<"$SECRETS")
            if [ -z "$val" ]; then echo "skip secret $src (absent)"; continue; fi
            printf '%s' "$val" | gh secret set "TF_VAR_$tfvar"
            echo "secret TF_VAR_$tfvar <- $src"
          done

      - name: Migrate variables
        run: |
          set -euo pipefail
          MAP=(
            OCI_REGION:oci_region
            OCI_FINGERPRINT:oci_fingerprint
            OCI_REQUESTOR_GROUP_NAME:requestor_group_name
            INFISICAL_ORG_ID:infisical_org_id
            INFISICAL_HOST:infisical_host
            CLOUDFLARE_ZONE:cloudflare_zone
            IDRIVE_AWS_REGION:idrive_aws_region
            IDRIVE_E2_ENDPOINT:idrive_e2_endpoint
            LOKI_BUCKET:loki_bucket
            THANOS_BUCKET:thanos_bucket
          )
          for pair in "${MAP[@]}"; do
            src=${pair%%:*}; tfvar=${pair#*:}
            val=$(jq -r --arg k "$src" '.[$k] // empty' <<<"$VARS")
            if [ -z "$val" ]; then echo "skip var $src (absent)"; continue; fi
            gh variable set "TF_VAR_$tfvar" --body "$val"
            echo "var TF_VAR_$tfvar <- $src"
          done

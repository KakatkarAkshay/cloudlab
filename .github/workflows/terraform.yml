name: Terraform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudlab-infrastructure
  cancel-in-progress: false

jobs:
  infra:
    name: ${{ github.event_name == 'pull_request' && 'Infra Plan' || 'Infra Plan and Apply' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repository: ${{ github.event.repository.name }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INFISICAL_MACHINE_IDENTITY_ID: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
      GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Export TF_VAR_* from secrets and variables
        env:
          SECRETS: ${{ toJSON(secrets) }}
          VARS: ${{ toJSON(vars) }}
        run: |
          emit() { jq -r 'to_entries[] | select(.key | startswith("TF_VAR_")) | "TF_VAR_\(.key[7:] | ascii_downcase)<<__TFEOF__\n\(.value)\n__TFEOF__"'; }
          { printf '%s' "$SECRETS" | emit; printf '%s' "$VARS" | emit; } >> "$GITHUB_ENV"

      - name: Configure OCI API key
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/oci_api_key.pem"
          printf '%s' "$TF_VAR_oci_private_key" > "$RUNNER_TEMP/oci_api_key.pem"

      - name: Fetch OIDC token for Infisical
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const jwt = await core.getIDToken("cloudlab-terraform")
            core.setSecret(jwt)
            core.exportVariable("INFISICAL_AUTH_JWT", jwt)

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize
        run: >-
          terraform init -input=false
          -backend-config="tenancy_ocid=$TF_VAR_tenancy_1_ocid"
          -backend-config="user_ocid=$TF_VAR_tenancy_1_user_ocid"
          -backend-config="fingerprint=$TF_VAR_oci_fingerprint"
          -backend-config="private_key_path=$RUNNER_TEMP/oci_api_key.pem"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -no-color tfplan

  cluster:
    name: ${{ github.event_name == 'pull_request' && 'Cluster Plan' || 'Cluster Plan and Apply' }}
    needs: infra
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cluster

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repository: ${{ github.event.repository.name }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INFISICAL_MACHINE_IDENTITY_ID: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
      GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Export TF_VAR_* from secrets and variables
        env:
          SECRETS: ${{ toJSON(secrets) }}
          VARS: ${{ toJSON(vars) }}
        run: |
          emit() { jq -r 'to_entries[] | select(.key | startswith("TF_VAR_")) | "TF_VAR_\(.key[7:] | ascii_downcase)<<__TFEOF__\n\(.value)\n__TFEOF__"'; }
          { printf '%s' "$SECRETS" | emit; printf '%s' "$VARS" | emit; } >> "$GITHUB_ENV"

      - name: Configure OCI API key
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/oci_api_key.pem"
          printf '%s' "$TF_VAR_oci_private_key" > "$RUNNER_TEMP/oci_api_key.pem"

      - name: Fetch OIDC token for Infisical
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const jwt = await core.getIDToken("cloudlab-terraform")
            core.setSecret(jwt)
            core.exportVariable("INFISICAL_AUTH_JWT", jwt)

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize
        run: >-
          terraform init -input=false
          -backend-config="tenancy_ocid=$TF_VAR_tenancy_1_ocid"
          -backend-config="user_ocid=$TF_VAR_tenancy_1_user_ocid"
          -backend-config="fingerprint=$TF_VAR_oci_fingerprint"
          -backend-config="private_key_path=$RUNNER_TEMP/oci_api_key.pem"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -no-color tfplan

  proxmox:
    name: ${{ github.event_name == 'pull_request' && 'Proxmox Plan' || 'Proxmox Plan and Apply' }}
    needs: cluster
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxmox

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Export TF_VAR_* from secrets and variables
        env:
          SECRETS: ${{ toJSON(secrets) }}
          VARS: ${{ toJSON(vars) }}
        run: |
          emit() { jq -r 'to_entries[] | select(.key | startswith("TF_VAR_")) | "TF_VAR_\(.key[7:] | ascii_downcase)<<__TFEOF__\n\(.value)\n__TFEOF__"'; }
          { printf '%s' "$SECRETS" | emit; printf '%s' "$VARS" | emit; } >> "$GITHUB_ENV"

      - name: Configure OCI API key
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/oci_api_key.pem"
          printf '%s' "$TF_VAR_oci_private_key" > "$RUNNER_TEMP/oci_api_key.pem"

      - name: Connect to Tailscale and accept subnet routes
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-routes
          use-cache: "true"

      - name: Verify Proxmox network access
        run: |
          curl --fail --insecure --silent --show-error --connect-timeout 10 https://192.168.20.2:8006/api2/json/version >/dev/null
          timeout 10 bash -c '</dev/tcp/192.168.20.3/50000'

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize
        run: >-
          terraform init -input=false
          -backend-config="tenancy_ocid=$TF_VAR_tenancy_1_ocid"
          -backend-config="user_ocid=$TF_VAR_tenancy_1_user_ocid"
          -backend-config="fingerprint=$TF_VAR_oci_fingerprint"
          -backend-config="private_key_path=$RUNNER_TEMP/oci_api_key.pem"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false -no-color tfplan

name: Renovate Automerge

on:
  workflow_run:
    workflows: [Terraform]
    types: [completed]

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: renovate-automerge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge Renovate Pull Request
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Merge passing Renovate pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          MERGE_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.workflow_run.pull_requests[0]?.number;

            if (!pullNumber) {
              core.info("No pull request is associated with this workflow run.");
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });

            if (
              pull.user?.login !== "renovate[bot]" ||
              pull.state !== "open" ||
              !pull.head.ref.startsWith("renovate/")
            ) {
              core.info("Pull request is not an open Renovate pull request.");
              return;
            }

            const { data: checks } = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: pull.head.sha,
              per_page: 100,
            });

            for (const requiredCheck of ["gitleaks", "Plan"]) {
              const matchingChecks = checks.check_runs.filter(
                (check) => check.name === requiredCheck,
              );
              const successful =
                matchingChecks.length > 0 &&
                matchingChecks.every(
                  (check) =>
                    check.status === "completed" && check.conclusion === "success",
                );

              if (!successful) {
                core.info(`Required check '${requiredCheck}' has not completed successfully.`);
                return;
              }
            }

            const { data: merge } = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pullNumber,
              merge_method: "squash",
              sha: pull.head.sha,
              headers: {
                authorization: `Bearer ${process.env.MERGE_TOKEN}`,
              },
            });

            if (!merge.merged) {
              throw new Error(merge.message);
            }

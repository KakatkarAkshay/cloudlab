name: Renovate Automerge

on:
  workflow_run:
    workflows: [Terraform]
    types: [completed]

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: renovate-automerge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    name: Merge Renovate Pull Request
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate Renovate pull request
        id: validate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.workflow_run.pull_requests[0]?.number;

            if (!pullNumber) {
              core.info("No pull request is associated with this workflow run.");
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });

            if (
              pull.user?.login !== "renovate[bot]" ||
              pull.state !== "open" ||
              !pull.head.ref.startsWith("renovate/")
            ) {
              core.info("Pull request is not an open Renovate pull request.");
              return;
            }

            const checks = await github.paginate(
              github.rest.checks.listForRef,
              { owner, repo, ref: pull.head.sha, per_page: 100 },
              (response) => response.data.check_runs,
            );
            const passingConclusions = new Set(["success", "neutral", "skipped"]);
            const blockingChecks = checks.filter(
              (check) =>
                check.status !== "completed" ||
                !passingConclusions.has(check.conclusion),
            );

            if (checks.length === 0 || blockingChecks.length > 0) {
              const details = blockingChecks
                .map((check) => `${check.name}: ${check.status}/${check.conclusion}`)
                .join(", ");
              core.info(`Not all checks have passed${details ? ` (${details})` : "."}`);
              return;
            }

            core.setOutput("pull-number", pullNumber);
            core.setOutput("head-sha", pull.head.sha);

      - name: Merge passing Renovate pull request
        if: steps.validate.outputs.pull-number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PULL_NUMBER: ${{ steps.validate.outputs.pull-number }}
          HEAD_SHA: ${{ steps.validate.outputs.head-sha }}
        with:
          github-token: ${{ secrets.TF_GITHUB_TOKEN }}
          script: |
            const { data: merge } = await github.rest.pulls.merge({
              ...context.repo,
              pull_number: Number(process.env.PULL_NUMBER),
              merge_method: "squash",
              sha: process.env.HEAD_SHA,
            });

            if (!merge.merged) {
              throw new Error(merge.message);
            }

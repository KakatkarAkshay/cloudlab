name: Renovate Automerge

on:
  workflow_run:
    workflows: [Terraform]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: renovate-automerge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}

    steps:
      - name: Merge passing Renovate pull request
        run: |
          set -euo pipefail

          if [[ -z "${PR_NUMBER:-}" ]]; then
            echo "No pull request is associated with this workflow run."
            exit 0
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          author="$(jq -r '.user.login' <<<"$pr_json")"
          state="$(jq -r '.state' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"

          if [[ "$author" != "renovate[bot]" || "$state" != "open" || "$head_ref" != renovate/* ]]; then
            echo "Pull request is not an open Renovate pull request."
            exit 0
          fi

          checks_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs?per_page=100")"

          for required_check in gitleaks Plan; do
            if ! jq -e --arg name "$required_check" '
              [.check_runs[] | select(.name == $name)] |
              length > 0 and all(.[]; .status == "completed" and .conclusion == "success")
            ' <<<"$checks_json" >/dev/null; then
              echo "Required check '$required_check' has not completed successfully."
              exit 0
            fi
          done

          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --match-head-commit "$head_sha"

          # GITHUB_TOKEN merges do not emit push workflows, so dispatch apply explicitly.
          gh workflow run terraform.yml --repo "$GITHUB_REPOSITORY" --ref main

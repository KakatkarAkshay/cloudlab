name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type "destroy cloudlab" to confirm
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudlab-infrastructure
  cancel-in-progress: false

jobs:
  cluster:
    name: Cluster Plan and Destroy
    if: inputs.confirmation == 'destroy cloudlab'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/cluster

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repository: ${{ github.event.repository.name }}
      TF_VAR_oci_region: ${{ vars.TF_VAR_OCI_REGION }}
      TF_VAR_oci_fingerprint: ${{ vars.TF_VAR_OCI_FINGERPRINT }}
      TF_VAR_oci_private_key: ${{ secrets.TF_VAR_OCI_PRIVATE_KEY }}
      TF_VAR_tenancy_1_ocid: ${{ secrets.TF_VAR_TENANCY_1_OCID }}
      TF_VAR_tenancy_1_user_ocid: ${{ secrets.TF_VAR_TENANCY_1_USER_OCID }}
      TF_VAR_infisical_host: ${{ vars.TF_VAR_INFISICAL_HOST }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INFISICAL_MACHINE_IDENTITY_ID: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
      GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Configure OCI API key
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/oci_api_key.pem"
          printf '%s' "$TF_VAR_oci_private_key" > "$RUNNER_TEMP/oci_api_key.pem"

      - name: Fetch OIDC token for Infisical
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const jwt = await core.getIDToken("cloudlab-terraform")
            core.setSecret(jwt)
            core.exportVariable("INFISICAL_AUTH_JWT", jwt)

      - name: Initialize
        run: >-
          terraform init -input=false
          -backend-config="tenancy_ocid=$TF_VAR_tenancy_1_ocid"
          -backend-config="user_ocid=$TF_VAR_tenancy_1_user_ocid"
          -backend-config="fingerprint=$TF_VAR_oci_fingerprint"
          -backend-config="private_key_path=$RUNNER_TEMP/oci_api_key.pem"

      - name: Plan destroy
        run: terraform plan -destroy -input=false -no-color -out=tfdestroy

      - name: Destroy
        run: terraform apply -input=false -no-color tfdestroy

  infra:
    name: Infra Plan and Destroy
    needs: cluster
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/infra

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repository: ${{ github.event.repository.name }}
      TF_VAR_oci_region: ${{ vars.TF_VAR_OCI_REGION }}
      TF_VAR_oci_fingerprint: ${{ vars.TF_VAR_OCI_FINGERPRINT }}
      TF_VAR_oci_private_key: ${{ secrets.TF_VAR_OCI_PRIVATE_KEY }}
      TF_VAR_tenancy_1_ocid: ${{ secrets.TF_VAR_TENANCY_1_OCID }}
      TF_VAR_tenancy_1_user_ocid: ${{ secrets.TF_VAR_TENANCY_1_USER_OCID }}
      TF_VAR_tenancy_1_compartment_ocid: ${{ secrets.TF_VAR_TENANCY_1_COMPARTMENT_OCID }}
      TF_VAR_tenancy_2_ocid: ${{ secrets.TF_VAR_TENANCY_2_OCID }}
      TF_VAR_tenancy_2_user_ocid: ${{ secrets.TF_VAR_TENANCY_2_USER_OCID }}
      TF_VAR_tenancy_2_compartment_ocid: ${{ secrets.TF_VAR_TENANCY_2_COMPARTMENT_OCID }}
      TF_VAR_requestor_group_name: ${{ vars.TF_VAR_REQUESTOR_GROUP_NAME }}
      TF_VAR_infisical_org_id: ${{ vars.TF_VAR_INFISICAL_ORG_ID }}
      TF_VAR_infisical_host: ${{ vars.TF_VAR_INFISICAL_HOST }}
      TF_VAR_oauth2_client_id: ${{ secrets.TF_VAR_OAUTH2_CLIENT_ID }}
      TF_VAR_oauth2_client_secret: ${{ secrets.TF_VAR_OAUTH2_CLIENT_SECRET }}
      TF_VAR_oauth2_authorized_emails: ${{ secrets.TF_VAR_OAUTH2_AUTHORIZED_EMAILS }}
      TF_VAR_cloudflare_zone: ${{ vars.TF_VAR_CLOUDFLARE_ZONE }}
      TF_VAR_idrive_aws_region: ${{ vars.TF_VAR_IDRIVE_AWS_REGION }}
      TF_VAR_idrive_access_key_id: ${{ secrets.TF_VAR_IDRIVE_ACCESS_KEY_ID }}
      TF_VAR_idrive_secret_access_key: ${{ secrets.TF_VAR_IDRIVE_SECRET_ACCESS_KEY }}
      TF_VAR_idrive_e2_endpoint: ${{ vars.TF_VAR_IDRIVE_E2_ENDPOINT }}
      TF_VAR_loki_bucket: ${{ vars.TF_VAR_LOKI_BUCKET }}
      TF_VAR_thanos_bucket: ${{ vars.TF_VAR_THANOS_BUCKET }}
      TF_VAR_github_packages_token: ${{ secrets.TF_VAR_GITHUB_PACKAGES_TOKEN }}
      TF_VAR_github_runner_app_id: ${{ secrets.TF_VAR_GITHUB_RUNNER_APP_ID }}
      TF_VAR_github_runner_app_installation_id: ${{ secrets.TF_VAR_GITHUB_RUNNER_APP_INSTALLATION_ID }}
      TF_VAR_github_runner_app_private_key: ${{ secrets.TF_VAR_GITHUB_RUNNER_APP_PRIVATE_KEY }}
      TF_VAR_codex_lb_encryption_key: ${{ secrets.TF_VAR_CODEX_LB_ENCRYPTION_KEY }}
      TF_VAR_authentik_secret_key: ${{ secrets.TF_VAR_AUTHENTIK_SECRET_KEY }}
      TF_VAR_authentik_root_email: ${{ secrets.TF_VAR_AUTHENTIK_ROOT_EMAIL }}
      TF_VAR_volsync_restic_password: ${{ secrets.TF_VAR_VOLSYNC_RESTIC_PASSWORD }}
      TF_VAR_pangolin_node_hybrid_id: ${{ secrets.TF_VAR_PANGOLIN_NODE_HYBRID_ID }}
      TF_VAR_pangolin_node_hybrid_secret: ${{ secrets.TF_VAR_PANGOLIN_NODE_HYBRID_SECRET }}
      TF_VAR_tailscale_client_secret: ${{ secrets.TF_VAR_TAILSCALE_CLIENT_SECRET }}
      TF_VAR_headlamp_homelab_kubeconfig: ${{ secrets.TF_VAR_HEADLAMP_HOMELAB_KUBECONFIG }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INFISICAL_MACHINE_IDENTITY_ID: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
      GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: Configure OCI API key
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/oci_api_key.pem"
          printf '%s' "$TF_VAR_oci_private_key" > "$RUNNER_TEMP/oci_api_key.pem"

      - name: Fetch OIDC token for Infisical
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const jwt = await core.getIDToken("cloudlab-terraform")
            core.setSecret(jwt)
            core.exportVariable("INFISICAL_AUTH_JWT", jwt)

      - name: Initialize
        run: >-
          terraform init -input=false
          -backend-config="tenancy_ocid=$TF_VAR_tenancy_1_ocid"
          -backend-config="user_ocid=$TF_VAR_tenancy_1_user_ocid"
          -backend-config="fingerprint=$TF_VAR_oci_fingerprint"
          -backend-config="private_key_path=$RUNNER_TEMP/oci_api_key.pem"

      - name: Plan destroy
        run: terraform plan -destroy -input=false -no-color -out=tfdestroy

      - name: Destroy
        run: terraform apply -input=false -no-color tfdestroy

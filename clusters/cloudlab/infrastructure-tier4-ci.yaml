apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-tier4-ci
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-tier3-networking
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/tier4-ci
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system

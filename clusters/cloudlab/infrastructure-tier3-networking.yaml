apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-tier3-networking
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-tier2-certs-db
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/tier3-networking
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system

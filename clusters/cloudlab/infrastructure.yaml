apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  dependsOn:
    - name: kubelet-serving-cert-approver
    - name: gateway-api
    - name: snapshot-controller
    - name: external-secrets
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/cloudlab
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-tier2-certs-db
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-tier1-core
  interval: 10m
  retryInterval: 1m
  path: ./infrastructure/tier2-certs-db
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system

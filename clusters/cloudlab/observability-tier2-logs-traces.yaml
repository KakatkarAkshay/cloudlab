apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-tier2-logs-traces
  namespace: flux-system
spec:
  dependsOn:
    - name: observability-tier1-metrics
  interval: 10m
  retryInterval: 1m
  path: ./observability/tier2-logs-traces
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system

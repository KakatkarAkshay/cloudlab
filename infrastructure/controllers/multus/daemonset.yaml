apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: multus
  namespace: kube-system
  labels:
    app.kubernetes.io/name: multus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: multus
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multus
    spec:
      serviceAccountName: multus
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 10
      nodeSelector:
        kubernetes.io/hostname: chimera
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      initContainers:
        # Talos ships only the plugins flannel needs, so macvlan and its IPAM
        # helpers have to be placed on the node before Multus can delegate to them.
        - name: install-cni-plugins
          image: rancher/hardened-cni-plugins:v1.9.1-build20260807@sha256:50246381627c2a9935f95815ab9c39db2c033dd47ed1ac620c76f2c0fcd222f5
          command:
            - sh
            - -c
            - |
              set -eu
              for plugin in macvlan static host-local; do
                cp -f "/opt/cni/bin/${plugin}" /host/opt/cni/bin/
              done
              ls -l /host/opt/cni/bin/macvlan
          securityContext:
            privileged: true
          volumeMounts:
            - name: cnibin
              mountPath: /host/opt/cni/bin
              mountPropagation: Bidirectional
        - name: install-multus-binary
          image: ghcr.io/k8snetworkplumbingwg/multus-cni:v4.3.0@sha256:ec4e5dfe12b675e4dcbf4e9cd14892f7b4c8ac27aa0dc93cf2e9be0bdd7d764a
          command:
            - /install_multus
          args:
            - --type
            - thin
          securityContext:
            privileged: true
          volumeMounts:
            - name: cnibin
              mountPath: /host/opt/cni/bin
              mountPropagation: Bidirectional
      containers:
        - name: kube-multus
          image: ghcr.io/k8snetworkplumbingwg/multus-cni:v4.3.0@sha256:ec4e5dfe12b675e4dcbf4e9cd14892f7b4c8ac27aa0dc93cf2e9be0bdd7d764a
          command:
            - /thin_entrypoint
          args:
            - --multus-conf-file=auto
            - --multus-autoconfig-dir=/host/etc/cni/net.d
            - --cni-conf-dir=/host/etc/cni/net.d
          resources:
            requests:
              cpu: 100m
              memory: 50Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: cni
              mountPath: /host/etc/cni/net.d
            - name: cnibin
              mountPath: /host/opt/cni/bin
      volumes:
        - name: cni
          hostPath:
            path: /etc/cni/net.d
        - name: cnibin
          hostPath:
            path: /opt/cni/bin

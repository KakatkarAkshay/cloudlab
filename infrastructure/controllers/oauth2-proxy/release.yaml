apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oauth2-proxy
  namespace: flux-system
spec:
  interval: 30m
  releaseName: oauth2-proxy
  targetNamespace: oauth2-proxy
  dependsOn:
    - name: traefik
  chart:
    spec:
      chart: oauth2-proxy
      version: 10.7.0
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: oauth2-proxy
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    config:
      existingSecret: oauth2-proxy-credentials
      cookieName: _cloudlab_oauth2_proxy
      emailDomains:
        - "*"
      upstreams:
        - static://202
    authenticatedEmailsFile:
      enabled: true
      restricted_access: |-
        akshayakakatkaraa@gmail.com
    extraArgs:
      provider: google
      redirect-url: https://auth.kakatkarakshay.dev/oauth2/callback
      cookie-domain: .kakatkarakshay.dev
      cookie-secure: "true"
      cookie-samesite: lax
      cookie-refresh: 1h
      cookie-expire: 12h
      whitelist-domain: .kakatkarakshay.dev
      reverse-proxy: "true"
      set-xauthrequest: "true"
      pass-authorization-header: "true"
      set-authorization-header: "true"
      skip-provider-button: "true"
      code-challenge-method: S256
    gatewayApi:
      enabled: true
      gatewayRef:
        name: traefik-gateway
        namespace: traefik
      hostnames:
        - auth.kakatkarakshay.dev
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
    replicaCount: 2
    enableServiceLinks: false
    serviceAccount:
      automountServiceAccountToken: false
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: oauth2-proxy
            app.kubernetes.io/instance: oauth2-proxy
    podDisruptionBudget:
      enabled: true
      minAvailable: null
      maxUnavailable: 25%
    resources:
      requests:
        cpu: 20m
        memory: 64Mi

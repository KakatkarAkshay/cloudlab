apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thanos-objstore
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: thanos-objstore
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config: |
          type: S3
          config:
            bucket: cloudlab-thanos
            endpoint: s3.eu-central-2.idrivee2.com
            region: {{ .region | quote }}
            access_key: {{ .accessKey | quote }}
            secret_key: {{ .secretKey | quote }}
            bucket_lookup_type: path
  data:
    - secretKey: accessKey
      remoteRef:
        key: /platform/postgres-backup/ACCESS_KEY_ID
    - secretKey: secretKey
      remoteRef:
        key: /platform/postgres-backup/ACCESS_SECRET_KEY
    - secretKey: region
      remoteRef:
        key: /platform/postgres-backup/AWS_REGION

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: flux-system
spec:
  interval: 30m
  timeout: 15m
  releaseName: home-assistant
  targetNamespace: home-assistant
  chart:
    spec:
      chart: home-assistant
      version: 0.3.72
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: home-assistant
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    image:
      repository: ghcr.io/home-assistant/home-assistant
      pullPolicy: IfNotPresent
      tag: 2026.8.0@sha256:a21689ef0510df9760ee11bab4d6b2fef3ed5c1a29ed9c3224271597a23729eb
    controller:
      type: Deployment
    deploymentStrategy: Recreate
    serviceAccount:
      create: false
      name: home-assistant
    env:
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: home-assistant-postgresql-app
            key: uri
    service:
      type: ClusterIP
      port: 8123
    persistence:
      enabled: true
      existingClaim: home-assistant-config
    configuration:
      enabled: true
      forceInit: false
      templateConfig: |-
        default_config:

        recorder:
          purge_keep_days: 30
          commit_interval: 3
          db_url: !env_var DATABASE_URL

        automation: !include automations.yaml
        script: !include scripts.yaml
        scene: !include scenes.yaml
      initContainer:
        name: setup-config
        image: ghcr.io/home-assistant/home-assistant:2026.8.0@sha256:a21689ef0510df9760ee11bab4d6b2fef3ed5c1a29ed9c3224271597a23729eb
        securityContext:
          runAsUser: 0
        command:
          - /bin/sh
          - -c
        args:
          - /bin/sh /mnt/init/init.sh
        volumeMounts:
          - name: init-volume
            mountPath: /mnt/init/init.sh
            subPath: init.sh
          - name: config-volume
            mountPath: /config-templates
      initScript: |-
        #!/bin/sh
        set -eu

        if [ ! -f /config/configuration.yaml ]; then
          cp /config-templates/configuration.yaml /config/configuration.yaml
        fi

        for include_file in automations.yaml scripts.yaml scenes.yaml; do
          if [ ! -f "/config/$include_file" ]; then
            touch "/config/$include_file"
          fi
        done

        python3 - <<'PY'
        import io
        import shutil
        import urllib.request
        import zipfile
        from pathlib import Path

        with urllib.request.urlopen("https://github.com/hacs/integration/releases/latest/download/hacs.zip") as response:
            content = response.read()

        target = Path("/config/custom_components/hacs")
        with zipfile.ZipFile(io.BytesIO(content)) as archive:
            shutil.rmtree(target, ignore_errors=True)
            target.mkdir(parents=True)
            archive.extractall(target)
        PY
    resources:
      requests:
        cpu: 75m
        memory: 512Mi
      limits:
        memory: 2Gi

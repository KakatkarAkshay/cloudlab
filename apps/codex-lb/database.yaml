apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: idrive-e2-credentials
  namespace: codex-lb
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: idrive-e2-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: /platform/idrive-credentials/ACCESS_KEY_ID
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: /platform/idrive-credentials/ACCESS_SECRET_KEY
    - secretKey: AWS_REGION
      remoteRef:
        key: /platform/idrive-credentials/AWS_REGION
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: codex-lb-idrive-e2
  namespace: codex-lb
spec:
  configuration:
    destinationPath: s3://cloudnativepg-backup/codex-lb/
    endpointURL: https://s3.eu-central-2.idrivee2.com
    s3Credentials:
      accessKeyId:
        name: idrive-e2-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: idrive-e2-credentials
        key: ACCESS_SECRET_KEY
      region:
        name: idrive-e2-credentials
        key: AWS_REGION
    data:
      compression: gzip
    wal:
      compression: gzip
      maxParallel: 2
  retentionPolicy: 30d
  instanceSidecarConfiguration:
    retentionPolicyIntervalSeconds: 3600
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: codex-lb-postgresql
  namespace: codex-lb
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  bootstrap:
    recovery:
      source: codex-lb-postgresql-backup
  storage:
    size: 10Gi
    storageClass: local-path
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 25m
      memory: 384Mi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: codex-lb-idrive-e2
  externalClusters:
    - name: codex-lb-postgresql-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: codex-lb-idrive-e2
          serverName: codex-lb-postgresql
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: codex-lb-postgresql
  namespace: codex-lb
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: codex-lb-postgresql
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: codex-lb-idrive-e2

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: codex-lb
  namespace: codex-lb
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: codex-lb
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: encryption-key
      remoteRef:
        key: /apps/codex-lb/ENCRYPTION_KEY
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kubernetes
  namespace: codex-lb
spec:
  provider:
    kubernetes:
      remoteNamespace: codex-lb
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: codex-lb-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: codex-lb-database
  namespace: codex-lb
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: kubernetes
  target:
    name: codex-lb-database
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        uri: '{{ .source | replace "postgresql://" "postgresql+asyncpg://" }}'
  data:
    - secretKey: source
      remoteRef:
        key: codex-lb-postgresql-app
        property: uri

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: codex-lb
  namespace: flux-system
spec:
  interval: 30m
  releaseName: codex-lb
  targetNamespace: codex-lb
  chartRef:
    kind: OCIRepository
    name: codex-lb
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    global:
      imagePullSecrets:
        - ghcr
    image:
      registry: ghcr.io
      repository: abyssal-labs/codex-lb
      tag: latest@sha256:751d9dd79fdaefe2a48fbaed8cc560e0a456bcd405daaee7117d0d2d5d8342ea
      pullPolicy: Always
    replicaCount: 2
    serviceAccount:
      create: false
      name: codex-lb
    auth:
      existingSecret: codex-lb
      secretKeys:
        databaseUrl: uri
        encryptionKey: encryption-key
    postgresql:
      enabled: false
    externalDatabase:
      existingSecret: codex-lb-database
    ingress:
      enabled: false
    gatewayApi:
      enabled: true
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
      hostnames:
        - codex.kakatkarakshay.dev
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /v1
            - path:
                type: PathPrefix
                value: /backend-api/codex
            - path:
                type: PathPrefix
                value: /backend-api/transcribe
        - matches:
            - path:
                type: PathPrefix
                value: /
          filters:
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: oauth2-forward-auth
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

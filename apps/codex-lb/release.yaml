apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: codex-lb
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: codex-lb
  targetNamespace: codex-lb
  chartRef:
    kind: OCIRepository
    name: codex-lb
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    global:
      imagePullSecrets:
        - ghcr
    image:
      registry: ghcr.io
      repository: abyssal-labs/codex-lb
      tag: latest@sha256:992cae02002034136751efa2f0e59add6a899bb61fcacd6c6861a9c3d0c2cace
      pullPolicy: IfNotPresent
    replicaCount: 2
    serviceAccount:
      create: false
      name: codex-lb
    auth:
      existingSecret: codex-lb
      secretKeys:
        databaseUrl: uri
        encryptionKey: encryption-key
    postgresql:
      enabled: false
    externalDatabase:
      existingSecret: codex-lb-database
    extraEnv:
      - name: CODEX_LB_DASHBOARD_AUTH_MODE
        value: trusted_header
      - name: CODEX_LB_DASHBOARD_AUTH_PROXY_HEADER
        value: X-Auth-Request-Email
      - name: CODEX_LB_FIREWALL_TRUST_PROXY_HEADERS
        value: "true"
      - name: CODEX_LB_FIREWALL_TRUSTED_PROXY_CIDRS
        value: 10.244.0.0/16,fd00:10:244::/56
    ingress:
      enabled: false
    gatewayApi:
      enabled: true
      gateway:
        create: true
        gatewayClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
        listeners:
          - name: https
            hostname: codex.kakatkarakshay.dev
            port: 443
            protocol: HTTPS
            tls:
              mode: Terminate
              certificateRefs:
                - name: codex-kakatkarakshay-dev-tls
      hostnames:
        - codex.kakatkarakshay.dev
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /v1
            - path:
                type: PathPrefix
                value: /backend-api/codex
            - path:
                type: PathPrefix
                value: /backend-api/transcribe
        - matches:
            - path:
                type: PathPrefix
                value: /
          filters:
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: oauth2-forward-auth
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        memory: 1Gi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      grafanaDashboard:
        enabled: true
        folder: codex-lb

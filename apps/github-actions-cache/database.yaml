apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: github-actions-cache-postgresql
  namespace: github-actions-cache
spec:
  instances: 1
  bootstrap:
    initdb:
      database: cache
      owner: cache
  storage:
    size: 5Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

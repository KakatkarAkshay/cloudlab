apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: oauth2-proxy-headlamp
  namespace: headlamp
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: oauth2-proxy
  to:
    - group: ""
      kind: Service
      name: headlamp
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: oauth2-proxy
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - headlamp.kakatkarakshay.dev
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: oauth2-forward-auth
      backendRefs:
        - name: headlamp
          namespace: headlamp
          port: 80

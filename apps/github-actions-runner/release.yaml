apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: abyssal-labs-runner
  namespace: flux-system
spec:
  interval: 30m
  releaseName: abyssal-labs-runner
  targetNamespace: arc-runners
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    githubConfigUrl: https://github.com/abyssal-labs
    githubConfigSecret: github-actions-runner
    runnerScaleSetName: abyssal-labs-runner
    controllerServiceAccount:
      name: actions-runner-controller-gha-rs-controller
      namespace: arc-system
    scaleSetLabels:
      - self-hosted
      - dependabot
    template:
      spec:
        initContainers:
          - name: init-dind-externals
            image: ghcr.io/falcondev-oss/actions-runner:latest@sha256:396bad82ba63cbf574293dccc3f936aae60ef55450721d58a11978abaebb7a89
            imagePullPolicy: IfNotPresent
            command:
              - cp
            args:
              - -r
              - /home/runner/externals/.
              - /home/runner/tmpDir/
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir
          - name: dind
            image: docker:dind
            imagePullPolicy: IfNotPresent
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --group=$(DOCKER_GROUP_GID)
            env:
              - name: DOCKER_GROUP_GID
                value: "123"
            securityContext:
              privileged: true
            restartPolicy: Always
            startupProbe:
              exec:
                command:
                  - docker
                  - info
              initialDelaySeconds: 0
              failureThreshold: 24
              periodSeconds: 5
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dind-externals
                mountPath: /home/runner/externals
        containers:
          - name: runner
            image: ghcr.io/falcondev-oss/actions-runner:latest@sha256:396bad82ba63cbf574293dccc3f936aae60ef55450721d58a11978abaebb7a89
            imagePullPolicy: IfNotPresent
            command:
              - /home/runner/run.sh
            env:
              - name: CUSTOM_ACTIONS_RESULTS_URL
                value: http://github-actions-cache-server.github-actions-cache:3000/
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
              - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                value: "120"
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
        volumes:
          - name: dind-sock
            emptyDir: {}
          - name: dind-externals
            emptyDir: {}
          - name: work
            emptyDir: {}

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thanos-ca
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: thanos-ca
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: tls.ca
      remoteRef:
        key: /platform/observability/thanos/CA_CERT
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: thanos-mtls
  namespace: observability
spec:
  minVersion: VersionTLS13
  clientAuth:
    secretNames:
      - thanos-ca
    clientAuthType: RequireAndVerifyClientCert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: thanos-kakatkarakshay-dev
  namespace: observability
spec:
  secretName: thanos-kakatkarakshay-dev-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  dnsNames:
    - thanos.kakatkarakshay.dev
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: thanos-receive
  namespace: observability
  annotations:
    external-dns.alpha.kubernetes.io/target: gateway.kakatkarakshay.dev
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  entryPoints:
    - websecure
  tls:
    secretName: thanos-kakatkarakshay-dev-tls
    options:
      name: thanos-mtls
      namespace: observability
  routes:
    - kind: Rule
      match: Host(`thanos.kakatkarakshay.dev`) && PathPrefix(`/api/v1/receive`)
      services:
        - kind: Service
          name: thanos-receive-router
          port: 19291

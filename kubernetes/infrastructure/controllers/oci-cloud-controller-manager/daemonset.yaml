apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: oci-cloud-controller-manager
  namespace: kube-system
  labels:
    k8s-app: oci-cloud-controller-manager
spec:
  selector:
    matchLabels:
      component: oci-cloud-controller-manager
      tier: control-plane
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        component: oci-cloud-controller-manager
        tier: control-plane
    spec:
      serviceAccountName: cloud-controller-manager
      hostNetwork: true
      tolerations:
        - key: node.cloudprovider.kubernetes.io/uninitialized
          value: "true"
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: config
          secret:
            secretName: oci-cloud-controller-manager
      containers:
        - name: oci-cloud-controller-manager
          image: ghcr.io/oracle/cloud-provider-oci:v1.35.0@sha256:f228e27f5c5c1c26a3f6eb8e8e32ba4229eec50c3baac1b86c8eb75f5882e6de
          command:
            - /usr/local/bin/oci-cloud-controller-manager
          args:
            - --cloud-config=/etc/oci/cloud-provider.yaml
            - --cloud-provider=oci
            - --controllers=*,-cloud-node-lifecycle-controller
            - --leader-elect-resource-lock=leases
            - --concurrent-service-syncs=3
            - --v=2
          env:
            - name: CONFIG_YAML_FILENAME
              value: /etc/oci/cloud-provider.yaml
            - name: ENABLE_FLEX_CIDR_CONTROLLER
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/oci
              readOnly: true

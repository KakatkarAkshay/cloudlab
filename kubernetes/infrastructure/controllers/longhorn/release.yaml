apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets
  interval: 30m
  releaseName: longhorn
  targetNamespace: longhorn-system
  chart:
    spec:
      chart: longhorn
      version: 1.12.1
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: longhorn
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    defaultBackupStore:
      backupTarget: s3://longhorn@eu-central-2/
      backupTargetCredentialSecret: longhorn-idrive
      pollInterval: 300
    defaultSettings:
      allowRecurringJobWhileVolumeDetached: true
      backupConcurrentLimit: 2
      csiAllowedTopologyKeys: topology.cloudlab.io/location
      createDefaultDiskLabeledNodes: true
      defaultDataPath: /var/lib/longhorn
      defaultReplicaCount: 3
      replicaAutoBalance: best-effort
      restoreConcurrentLimit: 2
      storageMinimalAvailablePercentage: 0
      storageOverProvisioningPercentage: 100
      storageReservedPercentageForDefaultDisk: 0
    persistence:
      createStorageClass: false

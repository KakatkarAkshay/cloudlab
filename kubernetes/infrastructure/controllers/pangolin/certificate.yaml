apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-kakatkarakshay-dev
  namespace: pangolin
spec:
  secretName: wildcard-kakatkarakshay-dev-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  dnsNames:
    - kakatkarakshay.dev
    - "*.kakatkarakshay.dev"

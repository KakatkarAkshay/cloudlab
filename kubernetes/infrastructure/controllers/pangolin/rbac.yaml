apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pangolin-controller-certificates
  namespace: pangolin
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pangolin-controller-certificates
  namespace: pangolin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pangolin-controller-certificates
subjects:
  - kind: ServiceAccount
    name: pangolin-controller-sa
    namespace: pangolin

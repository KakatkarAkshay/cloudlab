apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 30m
  releaseName: traefik
  targetNamespace: traefik
  dependsOn:
    - name: cert-manager
  valuesFrom:
    - kind: Secret
      name: traefik-oci-placement
      valuesKey: values.yaml
  chart:
    spec:
      chart: traefik
      version: 41.2.0
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: traefik
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deployment:
      replicas: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
    ingressClass:
      enabled: true
      isDefaultClass: true
    providers:
      kubernetesCRD:
        enabled: true
        # The dashboard IngressRoute must reach the authentik outpost Service.
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: false
        ingressEndpoint:
          hostname: gateway.kakatkarakshay.dev
      kubernetesGateway:
        enabled: true
        statusAddress:
          hostname: gateway.kakatkarakshay.dev
          service:
            enabled: false
    gateway:
      enabled: false
    gatewayClass:
      enabled: true
    ingressRoute:
      dashboard:
        enabled: false
    service:
      nameOverride: traefik-triton
      annotations:
        external-dns.alpha.kubernetes.io/hostname: gateway.kakatkarakshay.dev
        oci.oraclecloud.com/load-balancer-type: nlb
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        ipFamilyPolicy: RequireDualStack
        ipFamilies:
          - IPv4
          - IPv6
      additionalServices:
        scorpion:
          annotations:
            external-dns.alpha.kubernetes.io/hostname: gateway.kakatkarakshay.dev
            oci.oraclecloud.com/load-balancer-type: nlb
          spec:
            type: LoadBalancer
            externalTrafficPolicy: Cluster
            ipFamilyPolicy: RequireDualStack
            ipFamilies:
              - IPv4
              - IPv6
    ports:
      web:
        port: 80
        expose:
          default: true
          scorpion: true
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
        forwardedHeaders:
          trustedIPs:
            - 10.244.0.0/16
            - fd00:10:244::/56
      websecure:
        port: 443
        expose:
          default: true
          scorpion: true
        forwardedHeaders:
          trustedIPs:
            - 10.244.0.0/16
            - fd00:10:244::/56
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 25%
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
    extraObjects:
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: authentik-forward-auth
          namespace: traefik
        spec:
          forwardAuth:
            address: http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik
            trustForwardHeader: true
            authResponseHeaders:
              - X-authentik-username
              - X-authentik-groups
              - X-authentik-entitlements
              - X-authentik-email
              - X-authentik-name
              - X-authentik-uid
              - X-authentik-jwt
              - X-authentik-meta-jwks
              - X-authentik-meta-outpost
              - X-authentik-meta-provider
              - X-authentik-meta-app
              - X-authentik-meta-version
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: dashboard-redirect
          namespace: traefik
        spec:
          redirectRegex:
            regex: ^https?://traefik\.kakatkarakshay\.dev/?$
            replacement: https://traefik.kakatkarakshay.dev/dashboard/
            permanent: true
      - apiVersion: traefik.io/v1alpha1
        kind: IngressRoute
        metadata:
          name: traefik-dashboard
          namespace: traefik
          annotations:
            external-dns.alpha.kubernetes.io/target: gateway.kakatkarakshay.dev
        spec:
          entryPoints:
            - websecure
          tls:
            secretName: traefik-kakatkarakshay-dev-tls
          routes:
            - kind: Rule
              match: Host(`traefik.kakatkarakshay.dev`) && Path(`/`)
              middlewares:
                - name: dashboard-redirect
              services:
                - kind: TraefikService
                  name: api@internal
            - kind: Rule
              match: Host(`traefik.kakatkarakshay.dev`) && PathPrefix(`/outpost.goauthentik.io/`)
              priority: 100
              services:
                - kind: Service
                  name: authentik-server
                  namespace: authentik
                  port: 80
            - kind: Rule
              match: Host(`traefik.kakatkarakshay.dev`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
              middlewares:
                - name: authentik-forward-auth
              services:
                - kind: TraefikService
                  name: api@internal

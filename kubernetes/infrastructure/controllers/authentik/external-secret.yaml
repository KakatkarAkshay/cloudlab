apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: authentik-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: /platform/authentik/SECRET_KEY
    - secretKey: AUTHENTIK_BOOTSTRAP_PASSWORD
      remoteRef:
        key: /platform/authentik/BOOTSTRAP_PASSWORD
    - secretKey: AUTHENTIK_BOOTSTRAP_TOKEN
      remoteRef:
        key: /platform/authentik/BOOTSTRAP_TOKEN
    - secretKey: ROOT_EMAIL
      remoteRef:
        key: /platform/authentik/ROOT_EMAIL
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: /platform/authentik/GOOGLE_CLIENT_ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: /platform/authentik/GOOGLE_CLIENT_SECRET

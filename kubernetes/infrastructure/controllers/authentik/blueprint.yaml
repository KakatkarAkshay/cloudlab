apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  cloudlab-forward-auth.yaml: |
    version: 1
    metadata:
      name: cloudlab-forward-auth
    entries:
      - model: authentik_sources_oauth.oauthsource
        id: google
        identifiers:
          slug: google
        attrs:
          name: Google
          enabled: true
          provider_type: google
          consumer_key: !Env GOOGLE_CLIENT_ID
          consumer_secret: !Env GOOGLE_CLIENT_SECRET
          # Enrollment is deliberately unset: only existing users may link.
          user_matching_mode: email_link
          authentication_flow:
            !Find [authentik_flows.flow, [slug, default-source-authentication]]
      - model: authentik_core.group
        id: admin
        identifiers:
          name: admin
        attrs:
          is_superuser: true
      - model: authentik_core.group
        id: member
        identifiers:
          name: member
      - model: authentik_core.group
        id: guest
        identifiers:
          name: guest
      - model: authentik_core.user
        identifiers:
          username: akshay
        attrs:
          name: Akshay Kakatkar
          email: !Env ROOT_EMAIL
          is_active: true
          groups:
            - !Find [authentik_core.group, [name, authentik Admins]]
            - !KeyOf admin
      - model: authentik_stages_identification.identificationstage
        identifiers:
          name: default-authentication-identification
        attrs:
          user_fields: []
          passwordless_flow: null
          sources:
            - !KeyOf google

      - model: authentik_providers_proxy.proxyprovider
        id: headlamp
        identifiers:
          name: headlamp
        attrs:
          mode: forward_single
          external_host: https://headlamp.kakatkarakshay.dev
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: headlamp
        attrs:
          name: Headlamp
          provider: !KeyOf headlamp
          meta_description: Kubernetes cluster UI
          meta_launch_url: https://headlamp.kakatkarakshay.dev/
          meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/headlamp.svg

      - model: authentik_providers_oauth2.oauth2provider
        id: kubernetes
        identifiers:
          name: kubernetes
        attrs:
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: public
          client_id: kubernetes
          redirect_uris:
            - matching_mode: strict
              url: https://headlamp.kakatkarakshay.dev/oidc-callback
              redirect_uri_type: authorization
            - matching_mode: strict
              url: http://localhost:8000
              redirect_uri_type: authorization
            - matching_mode: strict
              url: http://localhost:18000
              redirect_uri_type: authorization
          grant_types:
            - authorization_code
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          signing_key:
            !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        identifiers:
          slug: kubernetes
        attrs:
          name: Kubernetes
          provider: !KeyOf kubernetes
          meta_description: Kubernetes authentication
          meta_launch_url: https://headlamp.kakatkarakshay.dev/
          meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/kubernetes.svg

      - model: authentik_providers_oauth2.scopemapping
        id: immich-role
        identifiers:
          name: Immich role
        attrs:
          scope_name: immich
          description: Immich role derived from Authentik group membership
          expression: |
            is_admin = any(group.name == "admin" for group in request.user.groups.all())
            return {"immich_role": "admin" if is_admin else "user"}

      - model: authentik_providers_oauth2.oauth2provider
        id: immich
        identifiers:
          name: immich
        attrs:
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: !Env IMMICH_OAUTH_CLIENT_ID
          client_secret: !Env IMMICH_OAUTH_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://immich.kakatkarakshay.dev/auth/login
              redirect_uri_type: authorization
            - matching_mode: strict
              url: https://immich.kakatkarakshay.dev/user-settings
              redirect_uri_type: authorization
            - matching_mode: strict
              url: app.immich:///oauth-callback
              redirect_uri_type: authorization
          grant_types:
            - authorization_code
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !KeyOf immich-role
          signing_key:
            !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        identifiers:
          slug: immich
        attrs:
          name: Immich
          provider: !KeyOf immich
          meta_description: Photo and video library
          meta_launch_url: https://immich.kakatkarakshay.dev/
          meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/immich.svg

      - model: authentik_providers_proxy.proxyprovider
        id: longhorn
        identifiers:
          name: longhorn
        attrs:
          mode: forward_single
          external_host: https://longhorn.kakatkarakshay.dev
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: longhorn
        attrs:
          name: Longhorn
          provider: !KeyOf longhorn
          meta_description: Distributed block storage
          meta_launch_url: https://longhorn.kakatkarakshay.dev/
          meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/rancher-longhorn.svg

      - model: authentik_providers_proxy.proxyprovider
        id: codex
        identifiers:
          name: codex
        attrs:
          mode: forward_single
          external_host: https://codex.kakatkarakshay.dev
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: codex
        attrs:
          name: Codex LB
          provider: !KeyOf codex
          meta_description: Codex load balancer
          meta_launch_url: https://codex.kakatkarakshay.dev/
          meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/openai.svg

      - model: authentik_providers_proxy.proxyprovider
        id: blocky
        identifiers:
          name: blocky
        attrs:
          mode: forward_single
          external_host: https://blocky.kakatkarakshay.dev
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: blocky
        attrs:
          name: Blocky
          provider: !KeyOf blocky
          meta_description: DNS resolver and ad blocker
          meta_launch_url: https://blocky.kakatkarakshay.dev/
          meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/blocky.svg

      - model: authentik_providers_proxy.proxyprovider
        id: dns-credential-gateway
        identifiers:
          name: dns-credential-gateway
        attrs:
          mode: forward_single
          external_host: https://dns-config.kakatkarakshay.dev
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: dns-credential-gateway
        attrs:
          name: Private DNS
          provider: !KeyOf dns-credential-gateway
          meta_description: Provision authenticated encrypted DNS credentials
          meta_launch_url: https://dns-config.kakatkarakshay.dev/
          meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/blocky.svg

      - model: authentik_providers_proxy.proxyprovider
        id: traefik
        identifiers:
          name: traefik
        attrs:
          mode: forward_single
          external_host: https://cloudlab.kakatkarakshay.dev
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: traefik
        attrs:
          name: Traefik
          provider: !KeyOf traefik
          meta_description: Ingress controller dashboard
          meta_launch_url: https://cloudlab.kakatkarakshay.dev/dashboard/
          meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/traefik.svg

      - model: authentik_providers_proxy.proxyprovider
        id: node-red
        identifiers:
          name: node-red
        attrs:
          mode: forward_single
          external_host: https://node-red.kakatkarakshay.dev
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: node-red
        attrs:
          name: Node-RED
          provider: !KeyOf node-red
          meta_description: Flow based automation
          meta_launch_url: https://node-red.kakatkarakshay.dev/
          meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/node-red.svg

      - model: authentik_providers_proxy.proxyprovider
        id: blocky-homelab
        identifiers:
          name: blocky-homelab
        attrs:
          mode: forward_single
          external_host: https://blocky-homelab.kakatkarakshay.dev
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: blocky-homelab
        attrs:
          name: Blocky (Homelab)
          provider: !KeyOf blocky-homelab
          meta_description: DNS resolver and ad blocker
          meta_launch_url: https://blocky-homelab.kakatkarakshay.dev/
          meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/blocky.svg

      - model: authentik_providers_proxy.proxyprovider
        id: bluebubbles
        identifiers:
          name: bluebubbles
        attrs:
          mode: forward_single
          external_host: https://bluebubbles.kakatkarakshay.dev
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: bluebubbles
        attrs:
          name: BlueBubbles
          provider: !KeyOf bluebubbles
          meta_description: iMessage server
          meta_launch_url: https://bluebubbles.kakatkarakshay.dev/
          meta_icon: https://raw.githubusercontent.com/BlueBubblesApp/bluebubbles-server/master/icons/regular/icon-512.png

      - model: authentik_providers_proxy.proxyprovider
        id: longhorn-homelab
        identifiers:
          name: longhorn-homelab
        attrs:
          mode: forward_single
          external_host: https://longhorn-homelab.kakatkarakshay.dev
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: longhorn-homelab
        attrs:
          name: Longhorn (Homelab)
          provider: !KeyOf longhorn-homelab
          meta_description: Distributed block storage
          meta_launch_url: https://longhorn-homelab.kakatkarakshay.dev/
          meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/rancher-longhorn.svg

      - model: authentik_providers_proxy.proxyprovider
        id: traefik-homelab
        identifiers:
          name: traefik-homelab
        attrs:
          mode: forward_single
          external_host: https://homelab.kakatkarakshay.dev
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: traefik-homelab
        attrs:
          name: Traefik (Homelab)
          provider: !KeyOf traefik-homelab
          meta_description: Ingress controller dashboard
          meta_launch_url: https://homelab.kakatkarakshay.dev/dashboard/
          meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/traefik.svg

      - model: authentik_providers_proxy.proxyprovider
        id: immich-accelerator
        identifiers:
          name: immich-accelerator
        attrs:
          mode: forward_single
          external_host: https://immich-accelerator.kakatkarakshay.dev
          authorization_flow:
            !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow:
            !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: immich-accelerator
        attrs:
          name: Immich Accelerator
          provider: !KeyOf immich-accelerator
          meta_description: Apple Silicon processing dashboard for Immich
          meta_launch_url: https://immich-accelerator.kakatkarakshay.dev/
          meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/immich.svg

      - model: authentik_outposts.outpost
        identifiers:
          name: homelab
        attrs:
          type: proxy
          providers:
            - !KeyOf node-red
            - !KeyOf immich-accelerator
            - !KeyOf bluebubbles
            - !KeyOf blocky-homelab
            - !KeyOf longhorn-homelab
            - !KeyOf traefik-homelab
          config:
            authentik_host: https://auth.kakatkarakshay.dev
            authentik_host_browser: https://auth.kakatkarakshay.dev
            authentik_host_insecure: false
            log_level: info
            object_naming_template: ak-outpost-%(name)s
            refresh_interval: minutes=5

      - model: authentik_outposts.outpost
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          providers:
            - !KeyOf headlamp
            - !KeyOf longhorn
            - !KeyOf codex
            - !KeyOf blocky
            - !KeyOf dns-credential-gateway
            - !KeyOf traefik
          config:
            authentik_host: https://auth.kakatkarakshay.dev
            authentik_host_browser: https://auth.kakatkarakshay.dev
            authentik_host_insecure: false
            log_level: info
            object_naming_template: ak-outpost-%(name)s
            refresh_interval: minutes=5

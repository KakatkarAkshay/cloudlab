apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-kubeconfig
  namespace: headlamp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: headlamp-kubeconfig
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: config
      remoteRef:
        key: /platform/headlamp/HOMELAB_KUBECONFIG

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
  namespace: blocky
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blocky-ui
  namespace: blocky
spec:
  parentRefs:
    - name: blocky-ui
  hostnames:
    - blocky.kakatkarakshay.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io/
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik-forward-auth
      backendRefs:
        - name: blocky-ui
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blocky-doh
  namespace: blocky
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
spec:
  parentRefs:
    - name: blocky-dns
  hostnames:
    - dns.kakatkarakshay.dev
    - "*.dns.kakatkarakshay.dev"
  rules:
    - matches:
        - path:
            type: Exact
            value: /dns-query
        - path:
            type: PathPrefix
            value: /dns-query/
      backendRefs:
        - name: dns-credential-proxy
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dns-credential-portal
  namespace: blocky
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/hostname: dns-config.kakatkarakshay.dev
spec:
  parentRefs:
    - name: dns-credential-portal
  hostnames:
    - dns-config.kakatkarakshay.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io/
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
    - matches:
        - path:
            type: Exact
            value: /api/revocations
      backendRefs:
        - name: dns-credential-portal
          port: 8080
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik-forward-auth
      backendRefs:
        - name: dns-credential-portal
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: dns-credential-dot
  namespace: blocky
spec:
  entryPoints:
    - dot
  routes:
    - match: HostSNI(`*`)
      services:
        - name: dns-credential-proxy
          port: 8853
  tls:
    passthrough: true

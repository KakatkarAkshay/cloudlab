apiVersion: v1
kind: ServiceAccount
metadata:
  name: codex-lb
  namespace: codex-lb
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codex-lb-secret-reader
  namespace: codex-lb
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codex-lb-secret-reader
  namespace: codex-lb
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - codex-lb-postgresql-app
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codex-lb-secret-reader
  namespace: codex-lb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codex-lb-secret-reader
subjects:
  - kind: ServiceAccount
    name: codex-lb-secret-reader
    namespace: codex-lb

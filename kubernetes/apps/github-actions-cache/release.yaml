apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: github-actions-cache-server
  namespace: flux-system
spec:
  interval: 30m
  releaseName: github-actions-cache-server
  targetNamespace: github-actions-cache
  chartRef:
    kind: OCIRepository
    name: github-actions-cache-server
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/falcondev-oss/github-actions-cache-server
      tag: 9.7.0@sha256:3999b0202ec509f3b2084ef92cc50b408838e0d442b5997dd6dff2d89f4fe7b4
    replicaCount: 1
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
            weight: 100
    config:
      storage:
        driver: filesystem
        filesystem:
          path: /data/cache
      db:
        driver: postgres
    persistentVolumeClaim:
      enabled: true
      accessModes:
        - ReadWriteOnce
      storage: 20Gi
      storageClassName: longhorn
    service:
      type: ClusterIP
      port: 3000
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 25m
        memory: 256Mi
    extraEnv:
      - name: DB_POSTGRES_URL
        valueFrom:
          secretKeyRef:
            name: github-actions-cache-postgresql-app
            key: uri
